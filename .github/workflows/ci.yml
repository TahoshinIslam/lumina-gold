name: CI

on:
  push:
    branches: [main, admin-catalogue-editor]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Each step runs even if the one before it failed: one push should tell you
      # everything that is wrong, not just the first thing.
      - name: Typecheck
        id: typecheck
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # The unit suite: the security and inventory primitives (file sniffing,
      # signed URLs, rate limiting, origin checks). Fast and hermetic — no DB, no
      # server — so it belongs in the same gate as typecheck and lint.
      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: npm test

      # No database service here on purpose. Every page that touches MySQL is
      # `force-dynamic` or otherwise rendered per-request, so nothing queries it
      # at build time — verified by building against an unreachable port. If a
      # page ever starts reading the database during the build, this step is what
      # will tell you.
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build

  security:
    name: Dependencies · Secrets
    runs-on: ubuntu-latest

    steps:
      # Secret scanning needs the FULL history, not just the tip: a key that was
      # committed and then "removed" in a later commit is still in the repo and
      # still leaked. fetch-depth: 0 is what makes this scan mean anything.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fails the build on a HIGH or CRITICAL advisory in what we actually ship.
      #
      # --omit=dev on purpose: a vulnerability in a build-time tool is not a
      # vulnerability in the running site, and a scanner that cries wolf about
      # the toolchain gets muted within a week.
      #
      # A WARNING ABOUT `npm audit fix --force` HERE: at the time of writing, its
      # proposed "fix" for the postcss advisory was to downgrade Next 16 to
      # Next 9. Never run it unexamined. Both advisories open in this repo were
      # closed with `overrides` in package.json (postcss ^8.5.16, uuid ^11.1.1),
      # which patches them without touching the framework.
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

      # Report moderates, but do not block on them.
      - name: Dependency audit (full report)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev || true

      # Secrets. The admin password and AUTH_SECRET are read from env; this is
      # what stops one of them being pasted into a commit "just for testing".
      - name: Secret scan
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Continuous deployment ──────────────────────────────────────────────────
  # Ships to the VPS ONLY when everything above is green AND this is a push to
  # main (never on a pull request, never on the feature branch). The deploy
  # itself is the same sequence a human would run by hand (see hosting-
  # process.md §5): pull, install, build, then a zero-downtime pm2 reload.
  #
  # Requires four repository secrets (Settings → Secrets and variables →
  # Actions):
  #   SSH_HOST         server IP or hostname
  #   SSH_USER         the deploy user that owns /var/www/nahar
  #   SSH_KEY          that user's PRIVATE key (a deploy key with no passphrase)
  #   SSH_KNOWN_HOSTS  output of `ssh-keyscan <SSH_HOST>` — pins the server's
  #                    identity so a hijacked DNS record can't redirect the
  #                    deploy to an attacker's box. (Optional SSH_PORT if not 22.)
  deploy:
    name: Deploy to VPS
    needs: [check, security]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    # One deploy at a time, and NEVER cancel one mid-flight — a half-applied
    # `npm ci`/build on the live server is worse than waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    # A GitHub "environment" — lets you add a manual-approval gate or restrict
    # which branches may deploy later, without touching this file.
    environment:
      name: production
      url: https://naharjewellers.com

    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Remote deploy. `git pull --ff-only` refuses to deploy anything the
          # server has diverged onto; .env.production and public/uploads/ live
          # only on the server (git-ignored) and are untouched. Migrations are
          # deliberately NOT auto-run — apply new database/migrations/*.sql by
          # hand, since a failed migration mid-deploy is not something to
          # discover from a red pipeline.
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
              -o IdentitiesOnly=yes \
              "$SSH_USER@$SSH_HOST" 'bash -seuo pipefail' <<'REMOTE'
            cd /var/www/nahar
            git pull --ff-only
            npm ci
            npm run build
            pm2 reload nahar
          REMOTE
